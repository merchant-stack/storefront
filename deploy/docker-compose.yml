# Production stack for the Aeza VPS.
#
# Lives at /opt/rustskinpay/docker-compose.yml on the server.
# Images are pulled from GHCR — built and pushed by .github/workflows/deploy.yml.
#
# Local config files expected next to this one:
#   Caddyfile     -- reverse proxy + TLS
#   api.env       -- copy from api.env.example and fill in
#   worker.env    -- copy from worker.env.example and fill in
#   .env          -- written by the GitHub Actions deploy step: IMAGE_TAG=sha-xxxxxxxx

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - rustskinpay

  # Self-hosted Redis on the same VPS — replaces Upstash after the free-tier
  # quota blew up mid-flight. appendonly + bound mem keeps the queue safe
  # across reboots; ~10MB is plenty for our queue sizes (a few hundred
  # in-flight job records, a handful of locks/nonces).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - '128mb'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    expose:
      - '6379'
    networks:
      - rustskinpay
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    image: ghcr.io/merchant-stack/storefront-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - rustskinpay
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  api:
    image: ghcr.io/merchant-stack/storefront-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./api.env
    expose:
      - '4000'
    depends_on:
      - redis
    networks:
      - rustskinpay
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:4000/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    image: ghcr.io/merchant-stack/storefront-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./worker.env
    depends_on:
      - redis
    networks:
      - rustskinpay
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:4001/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  rustskinpay:

volumes:
  caddy_data:
  caddy_config:
  redis_data:
